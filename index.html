<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ローン・住宅ローン複数シナリオ比較ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">ローン・住宅ローン複数シナリオ比較</h1>
    <p class="text-center text-gray-500 text-sm mb-8">最大3シナリオを横並びで比較できます</p>

    <!-- シナリオ入力 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div id="scenario-0" class="bg-white rounded-xl shadow p-4 border-t-4 border-blue-500">
        <h2 class="font-bold text-blue-600 mb-3">シナリオ A</h2>
        <label class="block text-xs text-gray-600 mb-1" for="amount-0">借入金額（万円）</label>
        <input id="amount-0" type="number" value="3000" min="100" max="100000" aria-label="シナリオAの借入金額（万円）"
          class="w-full border rounded px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <label class="block text-xs text-gray-600 mb-1" for="rate-0">年利（%）</label>
        <input id="rate-0" type="number" value="1.5" min="0.1" max="20" step="0.01" aria-label="シナリオAの年利（%）"
          class="w-full border rounded px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <label class="block text-xs text-gray-600 mb-1" for="years-0">返済年数（年）</label>
        <input id="years-0" type="number" value="35" min="1" max="50" aria-label="シナリオAの返済年数（年）"
          class="w-full border rounded px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <label class="block text-xs text-gray-600 mb-1" for="extra-0">繰上返済（円/月）</label>
        <input id="extra-0" type="number" value="0" min="0" aria-label="シナリオAの繰上返済額（円/月）"
          class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>
      <div id="scenario-1" class="bg-white rounded-xl shadow p-4 border-t-4 border-green-500">
        <h2 class="font-bold text-green-600 mb-3">シナリオ B</h2>
        <label class="block text-xs text-gray-600 mb-1" for="amount-1">借入金額（万円）</label>
        <input id="amount-1" type="number" value="3000" min="100" max="100000" aria-label="シナリオBの借入金額（万円）"
          class="w-full border rounded px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-green-400">
        <label class="block text-xs text-gray-600 mb-1" for="rate-1">年利（%）</label>
        <input id="rate-1" type="number" value="2.0" min="0.1" max="20" step="0.01" aria-label="シナリオBの年利（%）"
          class="w-full border rounded px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-green-400">
        <label class="block text-xs text-gray-600 mb-1" for="years-1">返済年数（年）</label>
        <input id="years-1" type="number" value="30" min="1" max="50" aria-label="シナリオBの返済年数（年）"
          class="w-full border rounded px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-green-400">
        <label class="block text-xs text-gray-600 mb-1" for="extra-1">繰上返済（円/月）</label>
        <input id="extra-1" type="number" value="0" min="0" aria-label="シナリオBの繰上返済額（円/月）"
          class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400">
      </div>
      <div id="scenario-2" class="bg-white rounded-xl shadow p-4 border-t-4 border-orange-500">
        <h2 class="font-bold text-orange-600 mb-3">シナリオ C</h2>
        <label class="block text-xs text-gray-600 mb-1" for="amount-2">借入金額（万円）</label>
        <input id="amount-2" type="number" value="4000" min="100" max="100000" aria-label="シナリオCの借入金額（万円）"
          class="w-full border rounded px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
        <label class="block text-xs text-gray-600 mb-1" for="rate-2">年利（%）</label>
        <input id="rate-2" type="number" value="1.0" min="0.1" max="20" step="0.01" aria-label="シナリオCの年利（%）"
          class="w-full border rounded px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
        <label class="block text-xs text-gray-600 mb-1" for="years-2">返済年数（年）</label>
        <input id="years-2" type="number" value="25" min="1" max="50" aria-label="シナリオCの返済年数（年）"
          class="w-full border rounded px-3 py-2 text-sm mb-2 focus:outline-none focus:ring-2 focus:ring-orange-400">
        <label class="block text-xs text-gray-600 mb-1" for="extra-2">繰上返済（円/月）</label>
        <input id="extra-2" type="number" value="0" min="0" aria-label="シナリオCの繰上返済額（円/月）"
          class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
      </div>
    </div>

    <div class="text-center mb-8">
      <button id="calc-btn" aria-label="計算する"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-8 py-3 rounded-lg shadow transition">計算する</button>
    </div>

    <!-- 結果テーブル -->
    <div id="result-section" class="hidden">
      <h2 class="text-lg font-bold text-gray-700 mb-3">計算結果</h2>
      <div class="overflow-x-auto mb-6">
        <table class="w-full bg-white rounded-xl shadow text-sm">
          <thead>
            <tr class="bg-gray-100">
              <th class="text-left px-4 py-3 font-semibold text-gray-600">項目</th>
              <th class="px-4 py-3 font-semibold text-blue-600">シナリオ A</th>
              <th class="px-4 py-3 font-semibold text-green-600">シナリオ B</th>
              <th class="px-4 py-3 font-semibold text-orange-600">シナリオ C</th>
            </tr>
          </thead>
          <tbody id="result-table-body">
          </tbody>
        </table>
      </div>

      <!-- 棒グラフ比較 -->
      <h2 class="text-lg font-bold text-gray-700 mb-3">総支払利息の比較</h2>
      <div class="bg-white rounded-xl shadow p-6 mb-6">
        <div id="bar-chart" class="space-y-4"></div>
      </div>

      <!-- 繰上返済効果 -->
      <div id="extra-section" class="bg-white rounded-xl shadow p-6">
        <h2 class="text-lg font-bold text-gray-700 mb-3">繰上返済の短縮効果</h2>
        <div id="extra-result" class="space-y-2 text-sm text-gray-700"></div>
      </div>
    </div>
  </div>

  <script>
    function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

    const COLORS = ['blue','green','orange'];
    const COLOR_HEX = ['#3b82f6','#22c55e','#f97316'];
    const LABELS = ['A','B','C'];

    function calcLoan(principal, annualRate, years) {
      const r = annualRate / 100 / 12;
      const n = years * 12;
      if (r === 0) {
        const monthly = principal / n;
        return { monthly, total: principal, interest: 0, months: n };
      }
      const monthly = principal * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
      const total = monthly * n;
      const interest = total - principal;
      return { monthly, total, interest, months: n };
    }

    function calcWithExtra(principal, annualRate, years, extraMonthly) {
      const r = annualRate / 100 / 12;
      let balance = principal;
      let month = 0;
      const base = calcLoan(principal, annualRate, years);
      const monthlyBase = base.monthly;
      const totalPayment = monthlyBase + extraMonthly;
      while (balance > 0 && month < years * 12 * 2) {
        const interest = balance * r;
        const principal_part = totalPayment - interest;
        balance -= principal_part;
        month++;
        if (balance <= 0) break;
      }
      const totalPaid = monthlyBase * month; // approximate
      return {
        months: month,
        saved: (years * 12) - month,
        interestSaved: base.interest - (totalPaid - principal)
      };
    }

    function fmt(n) {
      return Math.round(n).toLocaleString('ja-JP') + ' 円';
    }
    function fmtMan(n) {
      return (Math.round(n / 10000)).toLocaleString('ja-JP') + ' 万円';
    }

    function getInputs() {
      return [0,1,2].map(i => ({
        amount: parseFloat(document.getElementById('amount-'+i).value) * 10000 || 0,
        rate: parseFloat(document.getElementById('rate-'+i).value) || 0,
        years: parseInt(document.getElementById('years-'+i).value) || 0,
        extra: parseFloat(document.getElementById('extra-'+i).value) || 0,
      }));
    }

    function saveToStorage(inputs) {
      try { localStorage.setItem('loanInputs', JSON.stringify(inputs)); } catch(e) {}
    }
    function loadFromStorage() {
      try {
        const d = JSON.parse(localStorage.getItem('loanInputs') || 'null');
        if (d && Array.isArray(d)) {
          d.forEach((v, i) => {
            if (!v) return;
            document.getElementById('amount-'+i).value = v.amount / 10000;
            document.getElementById('rate-'+i).value = v.rate;
            document.getElementById('years-'+i).value = v.years;
            document.getElementById('extra-'+i).value = v.extra;
          });
        }
      } catch(e) {}
    }

    document.getElementById('calc-btn').addEventListener('click', () => {
      const inputs = getInputs();
      saveToStorage(inputs);
      const results = inputs.map(inp => calcLoan(inp.amount, inp.rate, inp.years));

      // テーブル
      const rows = [
        ['月返済額', r => fmt(r.monthly)],
        ['総支払額', r => fmtMan(r.total)],
        ['総支払利息', r => fmtMan(r.interest)],
        ['返済回数', r => r.months + ' 回（' + Math.round(r.months/12*10)/10 + '年）'],
      ];
      const tbody = document.getElementById('result-table-body');
      tbody.innerHTML = '';
      rows.forEach(([label, fn]) => {
        const tr = document.createElement('tr');
        tr.className = 'border-t';
        tr.innerHTML = '<td class="px-4 py-3 font-medium text-gray-700">' + escHtml(label) + '</td>'
          + results.map(r => '<td class="px-4 py-3 text-center">' + escHtml(fn(r)) + '</td>').join('');
        tbody.appendChild(tr);
      });

      // 棒グラフ（総利息比較）
      const maxInterest = Math.max(...results.map(r => r.interest), 1);
      const barChart = document.getElementById('bar-chart');
      barChart.innerHTML = '';
      results.forEach((r, i) => {
        const pct = r.interest / maxInterest * 100;
        barChart.innerHTML += `
          <div class="flex items-center gap-3">
            <span class="w-20 text-sm font-semibold" style="color:${COLOR_HEX[i]}">シナリオ ${escHtml(LABELS[i])}</span>
            <div class="flex-1 bg-gray-100 rounded-full h-6 relative">
              <div class="h-6 rounded-full transition-all" style="width:${pct}%;background:${COLOR_HEX[i]};min-width:4px;"></div>
            </div>
            <span class="w-32 text-sm text-right text-gray-700">${escHtml(fmtMan(r.interest))}</span>
          </div>`;
      });

      // 繰上返済効果
      const extraSection = document.getElementById('extra-result');
      extraSection.innerHTML = '';
      inputs.forEach((inp, i) => {
        if (inp.extra > 0) {
          const eff = calcWithExtra(inp.amount, inp.rate, inp.years, inp.extra);
          const savedYM = eff.saved > 0
            ? Math.floor(eff.saved/12) + '年' + (eff.saved%12) + 'ヶ月短縮'
            : '変化なし';
          extraSection.innerHTML += `<div class="p-3 rounded-lg bg-gray-50 border">
            <span class="font-semibold" style="color:${COLOR_HEX[i]}">シナリオ ${escHtml(LABELS[i])}</span>：
            ${escHtml(savedYM)}（${escHtml(eff.months + 'ヶ月で完済')}）
          </div>`;
        }
      });
      if (extraSection.innerHTML === '') {
        extraSection.innerHTML = '<p class="text-gray-400 text-sm">繰上返済額を入力すると短縮効果が表示されます。</p>';
      }

      document.getElementById('result-section').classList.remove('hidden');
    });

    loadFromStorage();
    document.getElementById('calc-btn').click();
  </script>
</body>
</html>
